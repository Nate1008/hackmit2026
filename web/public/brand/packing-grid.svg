<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <g id="cell" stroke="#71988b" stroke-width="1">
      <path d="M0 40 80 0 160 40 80 80Z" fill="#e0eee8" fill-opacity=".55"/>
      <path d="M0 40v90l80 40V80Z" fill="#d1e6dc" fill-opacity=".28"/>
      <path d="M80 80v90l80-40V40Z" fill="#f3f8f5" fill-opacity=".6"/>
    </g>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white"/><stop offset=".75" stop-color="#777"/><stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="edge"><rect width="600" height="480" fill="url(#fade)"/></mask>
  </defs>
  <g opacity=".34" mask="url(#edge)">
    <use href="#cell" x="-100" y="-50"/><use href="#cell" x="60" y="-50"/>
    <use href="#cell" x="220" y="-50"/><use href="#cell" x="380" y="-50"/>
    <use href="#cell" x="-180" y="80"/><use href="#cell" x="-20" y="80"/>
    <use href="#cell" x="140" y="80"/><use href="#cell" x="300" y="80"/>
    <use href="#cell" x="-100" y="210"/><use href="#cell" x="60" y="210"/>
  </g>
  <g transform="translate(1440 900) rotate(180)" opacity=".4" mask="url(#edge)">
    <use href="#cell" x="-100" y="-50"/><use href="#cell" x="60" y="-50"/>
    <use href="#cell" x="220" y="-50"/><use href="#cell" x="380" y="-50"/>
    <use href="#cell" x="-180" y="80"/><use href="#cell" x="-20" y="80"/>
    <use href="#cell" x="140" y="80"/><use href="#cell" x="300" y="80"/>
    <use href="#cell" x="-100" y="210"/><use href="#cell" x="60" y="210"/>
  </g>
</svg>
