<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" stroke="#78948a" stroke-opacity="0.48" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
  <!-- single box -->
  <g transform="translate(48 44)">
    <path d="M6 30 L46 12 L86 30 L86 74 L46 92 L6 74 Z"/>
    <path d="M6 30 L46 48 L86 30"/>
    <path d="M46 48 L46 92"/>
    <path d="M22 66 l0 -9 m-3 3 l3 -3 l3 3"/>
  </g>

  <!-- two boxes stacked -->
  <g transform="translate(470 391) scale(.85)">
    <path d="M6 70 L46 52 L86 70 L86 106 L46 124 L6 106 Z"/>
    <path d="M6 70 L46 88 L86 70"/>
    <path d="M46 88 L46 124"/>
    <path d="M18 40 L46 28 L74 40 L74 64 L46 76 L18 64 Z"/>
    <path d="M18 40 L46 52 L74 40"/>
    <path d="M46 52 L46 76"/>
  </g>

  <!-- roll of tape -->
  <g transform="translate(240 65) scale(.85)">
    <circle cx="36" cy="36" r="30"/>
    <circle cx="36" cy="36" r="12"/>
    <path d="M66 36 L92 36"/>
  </g>

  <!-- moving van -->
  <g transform="translate(440 59) scale(.8)">
    <rect x="6" y="14" width="92" height="56" rx="3"/>
    <path d="M98 30 L124 30 L142 50 L142 70 L98 70"/>
    <path d="M124 30 L124 50 L142 50"/>
    <circle cx="32" cy="76" r="9"/>
    <circle cx="118" cy="76" r="9"/>
    <path d="M6 70 L23 70 M41 70 L109 70 M127 70 L142 70"/>
  </g>

  <!-- hand truck -->
  <g transform="translate(240 409) rotate(12 32 45)">
    <path d="M12 8h14v70h42M26 70h34"/>
    <rect x="31" y="29" width="30" height="35" rx="2"/>
    <path d="M42 29v10h8V29"/>
    <circle cx="28" cy="82" r="8"/>
  </g>

  <!-- measuring ruler -->
  <g transform="translate(50 443) rotate(-24 50 12)">
    <rect x="0" y="0" width="96" height="24" rx="3"/>
    <path d="M16 0v10m16-10v6m16-6v10m16-10v6m16-6v10"/>
  </g>

  <!-- sparse registration dots keep the spacing light -->
  <g fill="#78948a" fill-opacity="0.24" stroke="none">
    <circle cx="372" cy="262" r="1.5"/>
    <circle cx="46" cy="270" r="1.5"/>
    <circle cx="318" cy="390" r="1.5"/>
    <circle cx="230" cy="564" r="1.5"/>
    <circle cx="568" cy="568" r="1.5"/>
  </g>
